<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <title>ChefCode.ai — AI Invoice Coding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // App rebrand: the authenticated app (App.tsx / components) is styled by
      // the Tailwind CDN, not the Vite build. Remap `cyan` to the ChefCode
      // brand green so the app's existing cyan-* classes render green without
      // touching every file, and expose `brand` + `cream` too.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cyan:  { 50:'#eef6f1',100:'#d6ebe0',200:'#aed7c2',300:'#7cbda0',400:'#4a9d7c',500:'#1e7d5c',600:'#157559',700:'#115e48',800:'#0e4a39',900:'#0c3d30' },
              brand: { 50:'#eef6f1',100:'#d6ebe0',200:'#aed7c2',300:'#7cbda0',400:'#4a9d7c',500:'#1e7d5c',600:'#157559',700:'#115e48',800:'#0e4a39',900:'#0c3d30' },
              cream: { DEFAULT:'#faf6e8',50:'#fbf8ee',100:'#f6efce',200:'#ece4c9',300:'#e0d5b0' },
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.574.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "jspdf": "https://esm.sh/jspdf@^2.5.1",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
  }
}
</script>
</head>
  <body class="bg-slate-50 text-slate-900 antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
