<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>ChefCode.ai — AI Invoice Coding</title>

    <!-- Search + link previews. This is a client-rendered SPA, so the crawler
         and the link unfurlers (LinkedIn, Slack, iMessage, WhatsApp, Outlook)
         only ever see this <head> — none of the page copy. Everything a shared
         link needs to render a card has to live here. og:image must be an
         absolute URL; relative paths are silently dropped by most unfurlers. -->
    <meta name="description" content="ChefCode reads your supplier invoices, assigns the right GL codes, and flags vendor overcharges — automatically. Built for food service teams." />
    <link rel="canonical" href="https://www.chefcode.cc/" />
    <meta name="theme-color" content="#157559" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ChefCode.ai" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.chefcode.cc/" />
    <meta property="og:title" content="ChefCode.ai — AI Invoice Coding" />
    <meta property="og:description" content="ChefCode reads your supplier invoices, assigns the right GL codes, and flags vendor overcharges — automatically. Built for food service teams." />
    <meta property="og:image" content="https://www.chefcode.cc/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ChefCode.ai — Code every invoice in seconds." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ChefCode.ai — AI Invoice Coding" />
    <meta name="twitter:description" content="ChefCode reads your supplier invoices, assigns the right GL codes, and flags vendor overcharges — automatically. Built for food service teams." />
    <meta name="twitter:image" content="https://www.chefcode.cc/og-image.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* Painted inline so the very first frame is already the brand cream.
         The compiled stylesheet arrives a moment later; without this the page
         flashed a cool grey (bg-slate-50) before switching to cream. */
      html, body { background: #faf6e8; color: #123a2c; }
      body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
</head>
  <body class="antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
